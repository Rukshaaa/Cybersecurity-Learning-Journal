# Snort NIDS Configuration Design
# Academic Learning Project
# Purpose: Define network, service, and port variables


################################################
# Network Variables
################################################


# Internal trusted networks
# Includes employee systems and internal resources

ipvar HOME_NET [
10.0.10.0/24,
172.16.50.0/24,
172.16.60.0/24
]


# Mobile/BYOD network
# Separate network because personal devices require additional monitoring

ipvar MOBILE_NET 10.0.20.0/24


# External untrusted network
# Any traffic outside of the organization's defined networks

ipvar EXTERNAL_NET !$HOME_NET



################################################
# Service Groups
################################################


# Public web server in DMZ

ipvar HTTP_SERVERS 172.16.50.10


# DNS server in DMZ

ipvar DNS_SERVERS 172.16.50.53


# Mail server in DMZ

ipvar MAIL_SERVERS 172.16.50.25


# Protected database server

ipvar DATABASE_SERVERS 172.16.60.100



################################################
# Port Groups
################################################


# Web traffic

portvar HTTP_PORTS [80,443]


# DNS communication

portvar DNS_PORTS 53


# Email services

portvar SMTP_PORTS [25,587]


# PostgreSQL database communication

portvar DATABASE_PORTS 5432



################################################
# Explanation
################################################


# HOME_NET:
# Includes internal organizational networks that contain
# trusted users, servers, and protected resources.
# These networks belong to the company environment.


# EXTERNAL_NET:
# Defined as everything outside HOME_NET because Internet
# traffic is considered untrusted.


# MOBILE_NET:
# Represents BYOD devices. It is separated from internal
# systems because personal devices have different security risks.


# Service Groups:
# Individual servers are grouped based on their purpose.
# Web, DNS, email, and database systems require different
# monitoring rules.


# Port Groups:
# Ports are assigned based on services running on each host.
# HTTP uses 80/443, DNS uses 53, mail uses 25/587,
# and PostgreSQL uses 5432.


# Cloud Resource:
# External cloud services such as AWS S3/API resources are
# treated as external communication because they are not
# directly inside the organization's internal network.
